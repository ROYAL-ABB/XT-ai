<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ONE LIFE — $0 TO ???</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#07090d;
  --panel:#10141b;
  --panel2:#171c25;
  --line:#252c38;
  --text:#f5f7fa;
  --muted:#8e98a8;
  --green:#55e18d;
  --red:#ff6464;
  --yellow:#ffd166;
  --blue:#70a7ff;
}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 80% 0,#18243a 0,transparent 35%),
    radial-gradient(circle at 0 80%,#15201b 0,transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button{font:inherit}
button:active{transform:scale(.98)}
.hidden{display:none!important}

#app{
  max-width:1500px;
  margin:auto;
  min-height:100vh;
}

/* TOP */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:#080b10e8;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.logo{
  font-weight:1000;
  letter-spacing:2px;
}
.logo span{color:var(--green)}
.clock{
  color:var(--muted);
  font-size:12px;
}
.money{
  font-size:22px;
  font-weight:900;
  color:var(--green);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:12px;
}
.stat{
  background:#ffffff05;
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 9px;
}
.statTop{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
  margin-bottom:5px;
}
.bar{
  height:4px;
  background:#242a33;
  border-radius:20px;
  overflow:hidden;
}
.fill{
  height:100%;
  background:#eee;
  transition:.3s;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:220px 1fr 280px;
  min-height:calc(100vh - 110px);
}
nav{
  border-right:1px solid var(--line);
  padding:18px 12px;
}
.navBtn{
  display:block;
  width:100%;
  text-align:left;
  padding:12px;
  margin-bottom:6px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#aab2c0;
  cursor:pointer;
}
.navBtn:hover,.navBtn.active{
  background:#ffffff0b;
  color:#fff;
}
main{
  padding:25px;
  overflow:hidden;
}
aside{
  border-left:1px solid var(--line);
  padding:18px;
}

/* COMMON */
h1{
  margin:0 0 6px;
  font-size:30px;
}
.subtitle{
  color:var(--muted);
  margin-bottom:22px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}
.card{
  background:linear-gradient(145deg,#141922,#0d1117);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px;
}
.card h3{margin:7px 0}
.small{font-size:11px;color:var(--muted)}
.big{
  font-size:25px;
  font-weight:900;
}
.green{color:var(--green)}
.red{color:var(--red)}
.yellow{color:var(--yellow)}
.blue{color:var(--blue)}
.btn{
  width:100%;
  border:1px solid #ffffff15;
  background:#202630;
  color:white;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  margin-top:10px;
}
.btn:hover{background:#2a3340}
.btn.greenBtn{
  background:#dfffea;
  color:#08120c;
  font-weight:bold;
}
.btn.redBtn{
  background:#3a1719;
  color:#ffb5b5;
}
.price{
  font-size:19px;
  font-weight:800;
  margin-top:8px;
}
.tag{
  display:inline-block;
  font-size:9px;
  padding:4px 7px;
  border-radius:20px;
  background:#ffffff0b;
  color:#aeb6c3;
}

/* RIGHT */
.sideTitle{
  font-size:11px;
  letter-spacing:2px;
  color:#707b8c;
  margin-bottom:10px;
}
.log{
  padding:10px 0;
  border-bottom:1px solid #ffffff09;
  font-size:11px;
  line-height:1.4;
}
.logTime{
  color:#667080;
  font-size:9px;
}
.goal{
  background:#ffffff05;
  border:1px solid var(--line);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

/* HOME */
.hero{
  min-height:200px;
  border-radius:20px;
  border:1px solid var(--line);
  background:
    linear-gradient(90deg,#000b,#0002),
    radial-gradient(circle at 80% 50%,#24412e,#10141b 45%);
  padding:30px;
  display:flex;
  align-items:center;
  margin-bottom:18px;
}
.hero h2{
  font-size:36px;
  margin:0 0 10px;
}
.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  backdrop-filter:blur(8px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.modalBox{
  width:min(480px,100%);
  background:#11161e;
  border:1px solid #303846;
  border-radius:20px;
  padding:24px;
  box-shadow:0 30px 100px #000;
}
.modalBox h2{margin-top:0}
.modalActions{
  display:flex;
  gap:8px;
}
.modalActions button{flex:1}

/* MOBILE */
.mobileNav{display:none}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  nav,aside{display:none}
  main{
    padding:16px 16px 90px;
  }
  .stats{
    grid-template-columns:repeat(5,1fr);
    overflow:auto;
  }
  .stat{
    min-width:85px;
  }
  .quick{
    grid-template-columns:repeat(2,1fr);
  }
  .hero h2{font-size:27px}
  .mobileNav{
    position:fixed;
    display:flex;
    bottom:0;
    left:0;
    right:0;
    z-index:60;
    background:#0b0e13f2;
    border-top:1px solid var(--line);
    padding:7px;
    overflow:auto;
  }
  .mobileNav button{
    min-width:75px;
    border:0;
    background:none;
    color:#8993a3;
    font-size:9px;
    padding:8px 5px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="top">
    <div>
      <div class="logo">ONE <span>LIFE</span></div>
      <div class="clock" id="clock">DAY 1 • 08:00</div>
    </div>

    <div style="text-align:right">
      <div class="small">NET CASH</div>
      <div class="money" id="money">$0</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="statTop"><span>ENERGY</span><span id="energyN">100</span></div>
      <div class="bar"><div class="fill" id="energyB"></div></div>
    </div>

    <div class="stat">
      <div class="statTop"><span>HUNGER</span><span id="hungerN">100</span></div>
      <div class="bar"><div class="fill" id="hungerB"></div></div>
    </div>

    <div class="stat">
      <div class="statTop"><span>HAPPINESS</span><span id="happyN">60</span></div>
      <div class="bar"><div class="fill" id="happyB"></div></div>
    </div>

    <div class="stat">
      <div class="statTop"><span>HEALTH</span><span id="healthN">100</span></div>
      <div class="bar"><div class="fill" id="healthB"></div></div>
    </div>

    <div class="stat">
      <div class="statTop"><span>REPUTATION</span><span id="repN">0</span></div>
      <div class="bar"><div class="fill" id="repB"></div></div>
    </div>
  </div>
</header>

<div class="layout">

<nav id="desktopNav"></nav>

<main id="content"></main>

<aside>
  <div class="sideTitle">CURRENT GOALS</div>
  <div id="goals"></div>

  <div class="sideTitle" style="margin-top:25px">LIFE LOG</div>
  <div id="logs"></div>
</aside>

</div>

<div class="mobileNav" id="mobileNav"></div>

</div>

<div id="modal" class="hidden">
  <div class="modalBox">
    <div class="small" id="modalType">EVENT</div>
    <h2 id="modalTitle"></h2>
    <p id="modalText" style="color:#aab3c1;line-height:1.6"></p>
    <div id="modalActions" class="modalActions"></div>
  </div>
</div>

<script>
const locations = [
  ["home","⌂","Home"],
  ["jobs","▣","Jobs"],
  ["bank","$","Bank"],
  ["market","↗","Market"],
  ["business","◆","Business"],
  ["cars","▰","Cars"],
  ["property","▥","Property"],
  ["shop","□","Shop"],
  ["profile","◎","Life"]
];

const jobs = [
  {id:"delivery",name:"Delivery Rider",pay:55,energy:14,hours:3,req:0,rep:0},
  {id:"barista",name:"Coffee Shop Worker",pay:90,energy:18,hours:4,req:0,rep:1},
  {id:"sales",name:"Sales Representative",pay:190,energy:23,hours:5,req:5,rep:2},
  {id:"freelance",name:"Freelance Developer",pay:420,energy:25,hours:5,req:12,rep:3},
  {id:"manager",name:"Company Manager",pay:900,energy:30,hours:7,req:25,rep:5},
  {id:"executive",name:"Executive Consultant",pay:2200,energy:35,hours:8,req:55,rep:8}
];

const cars = [
  {id:"bike",name:"Used Bicycle",price:180,rep:1},
  {id:"sedan",name:"Old Sedan",price:4200,rep:4},
  {id:"sport",name:"Sports Coupe",price:38000,rep:10},
  {id:"lux",name:"Luxury SUV",price:92000,rep:18},
  {id:"super",name:"V12 Supercar",price:310000,rep:30},
  {id:"hyper",name:"Carbon Hypercar",price:2400000,rep:50}
];

const properties = [
  {id:"room",name:"Small Room",price:3500,income:0,happy:4},
  {id:"studio",name:"City Studio",price:28000,income:120,happy:8},
  {id:"apartment",name:"Luxury Apartment",price:180000,income:650,happy:15},
  {id:"villa",name:"Modern Villa",price:850000,income:2400,happy:22},
  {id:"penthouse",name:"Sky Penthouse",price:3200000,income:8500,happy:35}
];

const businesses = [
  {id:"cart",name:"Street Food Cart",price:1200,income:80,employees:1},
  {id:"agency",name:"Digital Agency",price:8500,income:420,employees:3},
  {id:"cafe",name:"Coffee Shop",price:24000,income:800,employees:5},
  {id:"garage",name:"Auto Garage",price:70000,income:2200,employees:8},
  {id:"software",name:"Software Company",price:280000,income:8500,employees:20},
  {id:"hotel",name:"Boutique Hotel",price:1200000,income:31000,employees:45},
  {id:"fund",name:"Investment Fund",price:6000000,income:145000,employees:80},
  {id:"empire",name:"Global Holdings",price:40000000,income:950000,employees:400}
];

const stocks = [
  {id:"nova",name:"NOVA",price:32.40},
  {id:"volt",name:"VOLT",price:81.20},
  {id:"axis",name:"AXIS",price:144.80},
  {id:"orbit",name:"ORBIT",price:18.60}
];

const state = {
  page:"home",
  day:1,
  hour:8,
  minute:0,
  money:0,
  debt:0,
  energy:100,
  hunger:100,
  happiness:60,
  health:100,
  reputation:0,
  skill:0,
  ownedCars:[],
  ownedProperties:[],
  ownedBusinesses:[],
  portfolio:{},
  stockPrices:{},
  logs:[],
  achievements:[],
  totalEarned:0,
  employees:0,
  lastIncomeDay:1
};

stocks.forEach(s=>state.stockPrices[s.id]=s.price);

function fmt(n){
  if(Math.abs(n)>=1000000000) return "$"+(n/1000000000).toFixed(2)+"B";
  if(Math.abs(n)>=1000000) return "$"+(n/1000000).toFixed(2)+"M";
  if(Math.abs(n)>=1000) return "$"+Math.round(n).toLocaleString();
  return "$"+Math.round(n);
}

function clamp(v,min=0,max=100){
  return Math.max(min,Math.min(max,v));
}

function addLog(text){
  state.logs.unshift({
    text,
    day:state.day,
    hour:state.hour
  });
  state.logs=state.logs.slice(0,20);
}

function save(){
  localStorage.setItem("oneLifeSave",JSON.stringify(state));
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem("oneLifeSave"));
    if(x) Object.assign(state,x);
  }catch(e){}
}

function advance(hours){
  state.hour+=hours;
  state.energy=clamp(state.energy-hours*2.5);
  state.hunger=clamp(state.hunger-hours*3);

  while(state.hour>=24){
    state.hour-=24;
    newDay();
  }

  if(state.hunger<15){
    state.health=clamp(state.health-4);
  }

  if(state.energy<10){
    state.health=clamp(state.health-2);
  }

  randomEvent();
  update();
}

function newDay(){
  state.day++;

  let income=0;

  state.ownedBusinesses.forEach(id=>{
    const b=businesses.find(x=>x.id===id);
    if(b) income+=b.income;
  });

  state.ownedProperties.forEach(id=>{
    const p=properties.find(x=>x.id===id);
    if(p) income+=p.income;
  });

  if(income>0){
    state.money+=income;
    state.totalEarned+=income;
    addLog("Passive income received: "+fmt(income));
  }

  if(state.debt>0){
    const interest=state.debt*.002;
    state.debt+=interest;
  }

  stocks.forEach(stock=>{
    let p=state.stockPrices[stock.id] || stock.price;
    p*=1+(Math.random()*.12-.06);
    state.stockPrices[stock.id]=Math.max(1,p);
  });

  state.energy=clamp(state.energy+20);
  state.hunger=clamp(state.hunger-8);

  checkAchievements();
}

function randomEvent(){
  if(Math.random()>.13) return;

  const events=[
    {
      title:"Lucky Find",
      text:"You found $80 in an old jacket.",
      action(){
        state.money+=80;
        state.totalEarned+=80;
        addLog("Found $80.");
      }
    },
    {
      title:"Unexpected Expense",
      text:"Your phone screen broke. Repair costs $75.",
      action(){
        state.money=Math.max(0,state.money-75);
        addLog("Paid $75 phone repair.");
      }
    },
    {
      title:"Networking Opportunity",
      text:"You met someone useful at a café. Reputation +3.",
      action(){
        state.reputation=clamp(state.reputation+3);
        addLog("Made a useful connection.");
      }
    },
    {
      title:"Great Day",
      text:"Things are going surprisingly well. Happiness +8.",
      action(){
        state.happiness=clamp(state.happiness+8);
      }
    }
  ];

  const e=events[Math.floor(Math.random()*events.length)];

  showModal("RANDOM EVENT",e.title,e.text,[
    ["Continue",()=>{
      e.action();
      closeModal();
      update();
    }]
  ]);
}

function work(id){
  const job=jobs.find(j=>j.id===id);

  if(state.skill<job.req){
    message("Locked","You need "+job.req+" skill to work this job.");
    return;
  }

  if(state.energy<job.energy){
    message("Too tired","You don't have enough energy.");
    return;
  }

  if(state.hunger<10){
    message("You're starving","Eat something before working.");
    return;
  }

  state.money+=job.pay;
  state.totalEarned+=job.pay;
  state.energy=clamp(state.energy-job.energy);
  state.happiness=clamp(state.happiness-2);
  state.skill+=1;
  state.reputation=clamp(state.reputation+job.rep*.2);

  addLog("Worked as "+job.name+" and earned "+fmt(job.pay)+".");
  advance(job.hours);
}

function sleep(){
  state.energy=100;
  state.health=clamp(state.health+8);
  state.happiness=clamp(state.happiness+3);

  let hours=8;

  state.hour+=hours;

  if(state.hour>=24){
    state.hour-=24;
    newDay();
  }

  addLog("Slept for 8 hours.");
  update();
}

function eat(price,amount,name){
  if(state.money<price){
    message("Not enough money","You can't afford this.");
    return;
  }

  state.money-=price;
  state.hunger=clamp(state.hunger+amount);
  state.happiness=clamp(state.happiness+2);
  addLog("Bought "+name+" for "+fmt(price)+".");
  advance(1);
}

function buyCar(id){
  const item=cars.find(x=>x.id===id);

  if(state.ownedCars.includes(id)) return;

  if(state.money<item.price){
    message("Not enough money","You need "+fmt(item.price)+".");
    return;
  }

  state.money-=item.price;
  state.ownedCars.push(id);
  state.reputation=clamp(state.reputation+item.rep);
  state.happiness=clamp(state.happiness+8);

  addLog("Bought "+item.name+".");

  checkAchievements();
  update();
}

function buyProperty(id){
  const p=properties.find(x=>x.id===id);

  if(state.ownedProperties.includes(id)) return;

  if(state.money<p.price){
    message("Not enough money","You need "+fmt(p.price)+".");
    return;
  }

  state.money-=p.price;
  state.ownedProperties.push(id);
  state.happiness=clamp(state.happiness+p.happy);

  addLog("Purchased "+p.name+".");
  checkAchievements();
  update();
}

function buyBusiness(id){
  const b=businesses.find(x=>x.id===id);

  if(state.ownedBusinesses.includes(id)) return;

  if(state.money<b.price){
    message("Not enough capital","You need "+fmt(b.price)+" to start this business.");
    return;
  }

  state.money-=b.price;
  state.ownedBusinesses.push(id);
  state.employees+=b.employees;
  state.reputation=clamp(state.reputation+4);

  addLog("Founded "+b.name+".");
  checkAchievements();
  update();
}

function loan(amount){
  const limit=5000+state.reputation*3000;

  if(state.debt+amount>limit){
    message("Loan denied","Your maximum total credit is "+fmt(limit)+".");
    return;
  }

  state.money+=amount;
  state.debt+=amount;

  addLog("Borrowed "+fmt(amount)+".");
  update();
}

function repay(){
  if(state.debt<=0) return;

  const amount=Math.min(state.money,state.debt);

  state.money-=amount;
  state.debt-=amount;

  addLog("Repaid "+fmt(amount)+" of debt.");
  update();
}

function buyStock(id){
  const price=state.stockPrices[id];

  if(state.money<price){
    message("Not enough cash","You can't afford one share.");
    return;
  }

  state.money-=price;
  state.portfolio[id]=(state.portfolio[id]||0)+1;

  addLog("Bought 1 share of "+id.toUpperCase()+".");
  update();
}

function sellStock(id){
  if(!state.portfolio[id]) return;

  const price=state.stockPrices[id];

  state.portfolio[id]--;
  state.money+=price;

  addLog("Sold 1 share of "+id.toUpperCase()+".");
  update();
}

function train(){
  if(state.money<100){
    message("Training","You need $100.");
    return;
  }

  state.money-=100;
  state.skill+=3;
  state.energy=clamp(state.energy-10);

  addLog("Completed skill training.");
  advance(2);
}

function checkAchievements(){
  unlock("first1000",state.totalEarned>=1000,"First $1K");
  unlock("car",state.ownedCars.length>0,"First Vehicle");
  unlock("boss",state.ownedBusinesses.length>0,"Business Owner");
  unlock("million",netWorth()>=1000000,"Millionaire");
  unlock("tenmillion",netWorth()>=10000000,"Eight Figures");
  unlock("billion",netWorth()>=1000000000,"Billionaire");
}

function unlock(id,condition,name){
  if(condition&&!state.achievements.includes(id)){
    state.achievements.push(id);
    addLog("Achievement unlocked: "+name);
    message("ACHIEVEMENT",name);
  }
}

function netWorth(){
  let n=state.money-state.debt;

  state.ownedCars.forEach(id=>{
    const x=cars.find(c=>c.id===id);
    if(x)n+=x.price*.7;
  });

  state.ownedProperties.forEach(id=>{
    const x=properties.find(p=>p.id===id);
    if(x)n+=x.price;
  });

  state.ownedBusinesses.forEach(id=>{
    const x=businesses.find(b=>b.id===id);
    if(x)n+=x.price;
  });

  Object.keys(state.portfolio).forEach(id=>{
    n+=(state.portfolio[id]||0)*(state.stockPrices[id]||0);
  });

  return n;
}

function passiveIncome(){
  let x=0;

  state.ownedBusinesses.forEach(id=>{
    const b=businesses.find(y=>y.id===id);
    if(b)x+=b.income;
  });

  state.ownedProperties.forEach(id=>{
    const p=properties.find(y=>y.id===id);
    if(p)x+=p.income;
  });

  return x;
}

function renderNav(){
  const html=locations.map(x=>`
    <button class="navBtn ${state.page===x[0]?"active":""}"
    onclick="go('${x[0]}')">
      <span style="display:inline-block;width:28px">${x[1]}</span>${x[2]}
    </button>
  `).join("");

  document.getElementById("desktopNav").innerHTML=html;

  document.getElementById("mobileNav").innerHTML=
    locations.map(x=>`
      <button onclick="go('${x[0]}')">
        <div style="font-size:17px;margin-bottom:3px">${x[1]}</div>
        ${x[2]}
      </button>
    `).join("");
}

function go(page){
  state.page=page;
  render();
  save();
}

function render(){
  renderNav();

  const content=document.getElementById("content");

  if(state.page==="home") renderHome(content);
  if(state.page==="jobs") renderJobs(content);
  if(state.page==="bank") renderBank(content);
  if(state.page==="market") renderMarket(content);
  if(state.page==="business") renderBusiness(content);
  if(state.page==="cars") renderCars(content);
  if(state.page==="property") renderProperty(content);
  if(state.page==="shop") renderShop(content);
  if(state.page==="profile") renderProfile(content);

  renderGoals();
  renderLogs();
}

  document.getElementById("logs").innerHTML=

        ${l.text}

    `).join("")

function update(){
  state.energy=clamp(state.energy);
  state.hunger=clamp(state.hunger);
  state.happiness=clamp(state.happiness);
  state.health=clamp(state.health);
  state.reputation=clamp(state.reputation);

  document.getElementById("money").textContent=fmt(state.money);

  document.getElementById("clock").textContent=
    "DAY "+state.day+" • "+String(state.hour).padStart(2,"0")+":00";

  const statMap=[
    ["energy",state.energy],
    ["hunger",state.hunger],
    ["happy",state.happiness],
    ["health",state.health],
    ["rep",state.reputation]
  ];

  statMap.forEach(x=>{
    document.getElementById(x[0]+"N").textContent=Math.round(x[1]);
    document.getElementById(x[0]+"B").style.width=x[1]+"%";
  });

  checkAchievements();
  render();
  save();
}

function showModal(type,title,text,actions){
  document.getElementById("modalType").textContent=type;
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;

  const box=document.getElementById("modalActions");
  box.innerHTML="";

  actions.forEach(a=>{
    const b=document.createElement("button");
    b.className="btn";
    b.textContent=a[0];
    b.onclick=a[1];
    box.appendChild(b);
  });

  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

function message(title,text){
  showModal("ONE LIFE",title,text,[
    ["OK",closeModal]
  ]);
}

function resetGame(){
  showModal(
    "WARNING",
    "Reset your life?",
    "This permanently deletes this save and starts again from $0.",
    [
      ["Cancel",closeModal],
      ["RESET",()=>{
        localStorage.removeItem("oneLifeSave");
        location.reload();
      }]
    ]
  );
}

load();

if(!state.logs.length){
  addLog("You arrived in the city with $0.");
}

update();
</script>
