<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WHO THE HELL AM I?</title>

<style>
:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --line:#292929;
  --text:#f4f4f4;
  --muted:#888;
  --accent:#fff;
  --danger:#ff3b3b;
  --good:#52d273;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow:hidden;
}
button{font:inherit}
.hidden{display:none!important}

#game{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 20%,#252525 0,#0b0b0b 35%,#000 80%);
}

/* CINEMATIC */
#intro{
  position:absolute;
  inset:0;
  background:#000;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}
#introText{
  max-width:800px;
  font-size:clamp(20px,4vw,38px);
  font-weight:700;
  line-height:1.5;
  animation:fade 1s;
}
@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

/* MAIN WORLD */
#world{
  position:absolute;
  inset:0;
  background:
    linear-gradient(#0003,#0009),
    radial-gradient(circle at 50% 15%,#514838,#1a1815 40%,#080808);
}
#roomTitle{
  position:absolute;
  top:35px;
  left:40px;
}
#roomTitle h1{
  margin:0;
  font-size:15px;
  letter-spacing:5px;
}
#roomTitle p{
  color:#aaa;
  margin-top:8px;
}

#scene{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(900px,90%);
  height:55%;
  border:1px solid #ffffff14;
  border-radius:25px;
  background:
    linear-gradient(130deg,#201c18,#0c0c0c 60%);
  box-shadow:0 30px 100px #000;
  overflow:hidden;
}

.window{
  position:absolute;
  width:45%;
  height:65%;
  left:8%;
  top:8%;
  background:linear-gradient(#101b26,#29231e);
  border:12px solid #111;
}
.window:after{
  content:"CITY • 04:17 AM";
  position:absolute;
  bottom:15px;
  left:15px;
  font-size:10px;
  letter-spacing:3px;
  color:#ffffff55;
}

.bed{
  position:absolute;
  width:50%;
  height:27%;
  right:5%;
  bottom:12%;
  background:linear-gradient(145deg,#38332c,#171717);
  transform:skew(-5deg);
  box-shadow:0 20px 40px #000;
}
.table{
  position:absolute;
  left:18%;
  bottom:13%;
  width:160px;
  height:70px;
  background:#191714;
}
.phoneObject{
  position:absolute;
  left:21%;
  bottom:24%;
  width:45px;
  height:85px;
  border-radius:10px;
  background:#050505;
  border:2px solid #555;
  box-shadow:0 0 30px #fff2;
  cursor:pointer;
}
.phoneObject:after{
  content:"47";
  position:absolute;
  right:-10px;
  top:-10px;
  width:25px;
  height:25px;
  background:#d22;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:bold;
}

.door{
  position:absolute;
  right:4%;
  top:8%;
  width:110px;
  height:62%;
  background:linear-gradient(90deg,#171717,#29231e);
  border:5px solid #080808;
  cursor:pointer;
}
.door:after{
  content:"●";
  position:absolute;
  left:15px;
  top:50%;
  color:#bda875;
}

.objectLabel{
  position:absolute;
  padding:7px 11px;
  background:#000c;
  border:1px solid #ffffff20;
  border-radius:30px;
  font-size:11px;
  letter-spacing:1px;
  pointer-events:none;
}

/* HUD */
#hud{
  position:absolute;
  top:25px;
  right:30px;
  display:flex;
  gap:10px;
  z-index:20;
}
.hudBox{
  padding:10px 15px;
  border:1px solid #ffffff1d;
  background:#0008;
  backdrop-filter:blur(12px);
  border-radius:12px;
  font-size:12px;
}
.green{color:var(--good)}

/* ACTIONS */
#actions{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:30;
}
.action{
  border:1px solid #ffffff25;
  background:#101010dd;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
}
.action:hover{
  background:#fff;
  color:#000;
}

/* PHONE */
#phone{
  position:absolute;
  z-index:80;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(390px,92vw);
  height:min(780px,90vh);
  border:8px solid #242424;
  border-radius:45px;
  background:#080808;
  box-shadow:0 30px 120px #000;
  overflow:hidden;
}
#phoneTop{
  height:45px;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  font-size:11px;
}
#phoneScreen{
  height:calc(100% - 45px);
  padding:18px;
  overflow:auto;
  background:
    radial-gradient(circle at 50% 0,#252525,#090909 50%);
}
#closePhone{
  position:absolute;
  right:15px;
  top:50px;
  z-index:5;
  border:0;
  background:#ffffff12;
  color:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}
.phoneHeader{
  margin:15px 0 25px;
}
.phoneHeader h2{
  margin:0;
  font-size:28px;
}
.phoneHeader p{
  color:#777;
  margin-top:6px;
}
.apps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.app{
  text-align:center;
  cursor:pointer;
  font-size:11px;
  color:#aaa;
}
.appIcon{
  margin:auto auto 7px;
  width:62px;
  height:62px;
  border-radius:17px;
  background:#1b1b1b;
  border:1px solid #ffffff15;
  display:grid;
  place-items:center;
  font-size:26px;
}
.app:hover .appIcon{
  background:#333;
}

.card{
  background:#151515;
  border:1px solid #ffffff0f;
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}
.card small{color:#777}
.card h3{margin:6px 0}
.red{color:#ff4c4c}

.back{
  border:0;
  background:none;
  color:#aaa;
  padding:0;
  margin-bottom:15px;
  cursor:pointer;
}

/* DIALOG */
#dialog{
  position:absolute;
  z-index:70;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  width:min(750px,92%);
  background:#080808ee;
  border:1px solid #ffffff20;
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 80px #000;
}
#speaker{
  font-size:11px;
  letter-spacing:3px;
  color:#aaa;
}
#dialogText{
  font-size:18px;
  line-height:1.5;
  margin:10px 0 18px;
}
.choice{
  display:block;
  width:100%;
  text-align:left;
  border:1px solid #ffffff15;
  background:#151515;
  color:#eee;
  padding:13px;
  margin-top:8px;
  border-radius:10px;
  cursor:pointer;
}
.choice:hover{
  background:#eee;
  color:#000;
}

/* NOTIFICATION */
#notification{
  position:absolute;
  z-index:90;
  top:25px;
  left:50%;
  transform:translateX(-50%) translateY(-150px);
  width:min(370px,90%);
  background:#171717e8;
  backdrop-filter:blur(20px);
  padding:15px;
  border-radius:18px;
  border:1px solid #ffffff18;
  transition:.4s;
}
#notification.show{
  transform:translateX(-50%) translateY(0);
}
#notification small{color:#888}

/* END CHAPTER */
#chapter{
  position:absolute;
  inset:0;
  z-index:150;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#chapter h1{
  font-size:clamp(35px,8vw,90px);
  margin:0;
}
#chapter p{
  color:#777;
  letter-spacing:5px;
}
</style>
</head>

<body>
<div id="game">

<div id="intro">
  <div id="introText"></div>
</div>

<div id="world" class="hidden">

  <div id="roomTitle">
    <h1>UNKNOWN RESIDENCE</h1>
    <p>Master Bedroom • 04:17 AM</p>
  </div>

  <div id="hud">
    <div class="hudBox">CASH <span class="green" id="cash">$2,147,830</span></div>
    <div class="hudBox">CLUES <span id="clues">0</span>/5</div>
  </div>

  <div id="scene">
    <div class="window"></div>
    <div class="bed"></div>
    <div class="table"></div>

    <div class="phoneObject" onclick="openPhone()"></div>

    <div class="door" onclick="doorAction()"></div>

    <div class="objectLabel" style="left:16%;bottom:6%">NIGHTSTAND</div>
    <div class="objectLabel" style="right:4%;top:4%">BEDROOM DOOR</div>
  </div>

  <div id="actions">
    <button class="action" onclick="inspectWallet()">Inspect Wallet</button>
    <button class="action" onclick="openPhone()">Check Phone</button>
    <button class="action" onclick="doorAction()">Answer Door</button>
  </div>

</div>

<div id="phone" class="hidden">
  <div id="phoneTop">
    <span>04:17</span>
    <span>●●● 93%</span>
  </div>

  <button id="closePhone" onclick="closePhone()">×</button>

  <div id="phoneScreen"></div>
</div>

<div id="dialog" class="hidden">
  <div id="speaker"></div>
  <div id="dialogText"></div>
  <div id="choices"></div>
</div>

<div id="notification">
  <small>UNKNOWN</small>
  <div id="notificationText"></div>
</div>

<div id="chapter" class="hidden">
  <div>
    <p>CHAPTER ONE COMPLETE</p>
    <h1>WHO WERE YOU?</h1>
  </div>
</div>

</div>

<script>
const state = {
  cash:2147830,
  clues:0,
  mayaTrust:0,
  unknownTrust:0,
  wallet:false,
  messages:false,
  door:false,
  blackCard:false
};

const introLines = [
  "...",
  "Your head is killing you.",
  "You don't remember falling asleep.",
  "Actually...",
  "You don't remember anything.",
  "Not this room.",
  "Not this house.",
  "Not even your own name.",
  "Then you notice the phone."
];

let introIndex = 0;

const intro = document.getElementById("intro");
const introText = document.getElementById("introText");
const world = document.getElementById("world");

function playIntro(){
  if(introIndex >= introLines.length){
    intro.style.display="none";
    world.classList.remove("hidden");

    setTimeout(()=>{
      notify("UNKNOWN","If you're reading this... you survived.");
    },900);

    setTimeout(()=>{
      notify("UNKNOWN","Don't trust Maya.");
    },3500);

    return;
  }

  introText.style.opacity=0;

  setTimeout(()=>{
    introText.textContent=introLines[introIndex++];
    introText.style.opacity=1;
  },250);

  setTimeout(playIntro,1500);
}

playIntro();

function money(n){
  return "$"+n.toLocaleString();
}

function updateHUD(){
  document.getElementById("cash").textContent=money(state.cash);
  document.getElementById("clues").textContent=state.clues;
  save();
}

function addClue(){
  state.clues++;
  updateHUD();

  if(state.clues>=5){
    setTimeout(()=>{
      document.getElementById("chapter").classList.remove("hidden");
    },1500);
  }
}

function notify(sender,text){
  const n=document.getElementById("notification");

  n.querySelector("small").textContent=sender;
  document.getElementById("notificationText").textContent=text;

  n.classList.add("show");

  setTimeout(()=>{
    n.classList.remove("show");
  },2600);
}

function inspectWallet(){
  if(state.wallet){
    dialog("YOU","There's nothing else inside.",[
      ["Close",closeDialog]
    ]);
    return;
  }

  state.wallet=true;
  state.blackCard=true;

  addClue();

  dialog(
    "YOU",
    "A black metal card. No bank logo. The name has been violently scratched away. Behind it is a VANTA GROUP access card.",
    [
      ["Take both cards",()=>{
        closeDialog();
        notify("CLUE DISCOVERED","VANTA GROUP ACCESS CARD");
      }]
    ]
  );
}

function doorAction(){
  if(state.door){
    mayaConversation2();
    return;
  }

  state.door=true;

  dialog(
    "MAYA",
    "Sir? You're awake. Thank God. I've been trying to reach you all night.",
    [
      ["Who are you?",()=>{
        state.mayaTrust--;
        mayaWho();
      }],
      ["What happened to me?",()=>{
        state.mayaTrust++;
        mayaAccident();
      }],
      ["Don't come in.",()=>{
        state.mayaTrust-=2;
        mayaBlocked();
      }]
    ]
  );
}

function mayaWho(){
  dialog(
    "MAYA",
    "...It's Maya. Your executive assistant. I've worked for you for four years.",
    [
      ["What's my name?",mayaName],
      ["I don't remember you.",mayaMemory]
    ]
  );
}

function mayaAccident(){
  dialog(
    "MAYA",
    "You disappeared after the VANTA board meeting last night. Your car was found abandoned. Then somehow you came home.",
    [
      ["Was anyone with me?",mayaMemory],
      ["What is VANTA?",mayaVanta]
    ]
  );
}

function mayaBlocked(){
  dialog(
    "MAYA",
    "Okay. I won't. But the board is already asking questions... and you have a meeting at nine.",
    [
      ["What board?",mayaVanta],
      ["Leave me alone.",closeDialog]
    ]
  );
}

function mayaName(){
  dialog(
    "MAYA",
    "That's not funny. You know I can't say it here.",
    [
      ["Why not?",()=>{
        state.mayaTrust++;
        dialog(
          "MAYA",
          "Because you made that rule yourself. No names inside this house. You said the walls weren't safe.",
          [["...",closeDialog]]
        );
        addClue();
      }]
    ]
  );
}

function mayaMemory(){
  dialog(
    "MAYA",
    "Look at me. Are you seriously telling me you don't remember anything?",
    [
      ["Nothing.",()=>{
        state.mayaTrust+=2;
        dialog(
          "MAYA",
          "Then we have a much bigger problem than the board.",
          [["Tell me everything.",mayaVanta]]
        );
      }],
      ["I'm testing you.",()=>{
        state.mayaTrust--;
        dialog(
          "MAYA",
          "Of course you are...",
          [["Close",closeDialog]]
        );
      }]
    ]
  );
}

function mayaVanta(){
  dialog(
    "MAYA",
    "VANTA Group. Your company. Technology, hotels, logistics, investments. You're the founder and CEO.",
    [
      ["How much is it worth?",()=>{
        dialog(
          "MAYA",
          "Publicly? 8.4 billion. What it's actually worth... only you know.",
          [["Close",closeDialog]]
        );
        addClue();
      }],
      ["Who wants me gone?",()=>{
        dialog(
          "MAYA",
          "That's a dangerous question to ask before you remember who your friends are.",
          [["Close",closeDialog]]
        );
      }]
    ]
  );
}

function mayaConversation2(){
  dialog(
    "MAYA",
    "Your driver is downstairs whenever you're ready.",
    [
      ["Where can I go?",()=>{
        dialog(
          "MAYA",
          "VANTA Tower, the hotel, your private garage... or nowhere. Staying here might actually be smartest.",
          [["Close",closeDialog]]
        );
      }],
      ["Close",closeDialog]
    ]
  );
}

function dialog(speaker,text,options){
  const box=document.getElementById("dialog");

  box.classList.remove("hidden");

  document.getElementById("speaker").textContent=speaker;
  document.getElementById("dialogText").textContent=text;

  const choices=document.getElementById("choices");
  choices.innerHTML="";

  options.forEach(option=>{
    const b=document.createElement("button");

    b.className="choice";
    b.textContent=option[0];
    b.onclick=option[1];

    choices.appendChild(b);
  });
}

function closeDialog(){
  document.getElementById("dialog").classList.add("hidden");
}

function openPhone(){
  document.getElementById("phone").classList.remove("hidden");
  phoneHome();
}

function closePhone(){
  document.getElementById("phone").classList.add("hidden");
}

function phoneHome(){
  const s=document.getElementById("phoneScreen");

  s.innerHTML=`
    <div class="phoneHeader">
      <h2>Good morning.</h2>
      <p>47 unread notifications</p>
    </div>

    <div class="apps">

      <div class="app" onclick="messagesApp()">
        <div class="appIcon">💬</div>
        Messages
      </div>

      <div class="app" onclick="bankApp()">
        <div class="appIcon">◈</div>
        Private Bank
      </div>

      <div class="app" onclick="contactsApp()">
        <div class="appIcon">♟</div>
        Contacts
      </div>

      <div class="app" onclick="galleryApp()">
        <div class="appIcon">▣</div>
        Gallery
      </div>

      <div class="app" onclick="notesApp()">
        <div class="appIcon">≡</div>
        Notes
      </div>

      <div class="app" onclick="vantaApp()">
        <div class="appIcon">V</div>
        VANTA
      </div>

    </div>
  `;
}

function phoneBack(){
  phoneHome();
}

function messagesApp(){
  if(!state.messages){
    state.messages=true;
    addClue();
  }

  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>Messages</h2>
      <p>47 unread</p>
    </div>

    <div class="card">
      <small>UNKNOWN • NOW</small>
      <h3 class="red">DON'T TRUST MAYA.</h3>
      <p>Delete this conversation after reading.</p>
    </div>

    <div class="card">
      <small>MAYA • 03:51</small>
      <h3>Where are you?</h3>
      <p>Please answer me. Your car is empty.</p>
    </div>

    <div class="card">
      <small>ADRIAN • YESTERDAY</small>
      <h3>You made a mistake.</h3>
      <p>The board won't forgive this one.</p>
    </div>

    <div class="card">
      <small>PRIVATE NUMBER • YESTERDAY</small>
      <h3>It's done.</h3>
      <p>You know where to find the rest.</p>
    </div>
  `;
}

function bankApp(){
  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>Private Bank</h2>
      <p>Personal accounts</p>
    </div>

    <div class="card">
      <small>AVAILABLE BALANCE</small>
      <h3 style="font-size:32px">${money(state.cash)}</h3>
    </div>

    <div class="card">
      <small>YESTERDAY • 23:48</small>
      <h3 class="red">-$500,000</h3>
      <p>Transfer • Account ending 0719</p>
    </div>

    <div class="card">
      <small>YESTERDAY • 18:02</small>
      <h3>+$83,400</h3>
      <p>VANTA GROUP</p>
    </div>
  `;
}

function contactsApp(){
  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>Contacts</h2>
    </div>

    <div class="card"><h3>Maya</h3><small>Executive Assistant</small></div>
    <div class="card"><h3>Adrian Vale</h3><small>VANTA Board</small></div>
    <div class="card"><h3>Driver</h3><small>Encrypted Contact</small></div>
    <div class="card"><h3>DO NOT ANSWER</h3><small>Unknown Number</small></div>
  `;
}

function galleryApp(){
  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>Gallery</h2>
      <p>1,284 items</p>
    </div>

    <div class="card">
      <small>LAST PHOTO • 11:41 PM</small>
      <h3>Security Door — B17</h3>
      <p>A blurry photograph of a steel door marked B17. Written beneath it: "If I forget."</p>
    </div>
  `;

  if(!state.galleryClue){
    state.galleryClue=true;
    addClue();
  }
}

function notesApp(){
  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>Notes</h2>
    </div>

    <div class="card">
      <small>LOCKED NOTE</small>
      <h3>IF SOMETHING HAPPENS</h3>
      <p>Password hint: "The first thing I bought when nobody believed me."</p>
    </div>
  `;
}

function vantaApp(){
  document.getElementById("phoneScreen").innerHTML=`
    <button class="back" onclick="phoneBack()">‹ Home</button>

    <div class="phoneHeader">
      <h2>VANTA</h2>
      <p>Executive access</p>
    </div>

    <div class="card">
      <small>COMPANY VALUATION</small>
      <h3>$8.4B</h3>
    </div>

    <div class="card">
      <small>TODAY • 09:00</small>
      <h3>Emergency Board Meeting</h3>
      <p>Attendance mandatory.</p>
    </div>

    <div class="card">
      <small>SECURITY</small>
      <h3 class="red">Executive credentials suspended</h3>
      <p>Authorization: A. Vale</p>
    </div>
  `;
}

function save(){
  localStorage.setItem("wthami_save",JSON.stringify(state));
}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem("wthami_save"));

    if(saved){
      Object.assign(state,saved);
      updateHUD();
    }
  }catch(e){}
}

load();
</script>

</body>
</html>
