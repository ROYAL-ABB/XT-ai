<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A FIGHT TO B</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,sans-serif;
  touch-action:none;
  user-select:none;
}
canvas{display:block}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  z-index:10;
}

#title{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
  letter-spacing:5px;
  font-size:15px;
}

#stats{
  position:absolute;
  top:20px;
  left:20px;
  background:#000a;
  padding:12px 15px;
  border-left:3px solid #fff;
  line-height:1.6;
  font-weight:bold;
}

#ammoBox{
  position:absolute;
  right:20px;
  bottom:25px;
  text-align:right;
}

#ammo{
  font-size:38px;
  font-weight:900;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:32px;
}

#message{
  position:absolute;
  top:30%;
  width:100%;
  text-align:center;
  font-size:28px;
  font-weight:900;
  text-shadow:0 3px 15px #000;
}

#controls{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

#joystick{
  pointer-events:auto;
  position:absolute;
  left:25px;
  bottom:30px;
  width:120px;
  height:120px;
  border:2px solid #ffffff55;
  border-radius:50%;
  background:#ffffff0c;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ffffff66;
  left:34px;
  top:34px;
}

#fire{
  pointer-events:auto;
  position:absolute;
  right:25px;
  bottom:35px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid #fff8;
  background:#ffffff20;
  color:white;
  font-weight:900;
  font-size:17px;
}

#reload{
  pointer-events:auto;
  position:absolute;
  right:45px;
  bottom:145px;
  width:65px;
  height:65px;
  border-radius:50%;
  border:1px solid #fff8;
  background:#0008;
  color:white;
  font-weight:bold;
}

#damage{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:30;
  box-shadow:inset 0 0 100px transparent;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="title">A FIGHT TO B</div>

  <div id="stats">
    HEALTH <span id="health">100</span><br>
    ARMOR <span id="armor">50</span><br>
    WAVE <span id="wave">1</span><br>
    SCORE <span id="score">0</span>
  </div>

  <div id="crosshair">+</div>

  <div id="message"></div>

  <div id="ammoBox">
    <div id="ammo">12 / 96</div>
    PULSE-9
  </div>
</div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <button id="reload">RELOAD</button>
  <button id="fire">FIRE</button>
</div>

<div id="damage"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const healthEl = document.getElementById("health");
const armorEl = document.getElementById("armor");
const waveEl = document.getElementById("wave");
const scoreEl = document.getElementById("score");
const ammoEl = document.getElementById("ammo");
const messageEl = document.getElementById("message");
const damageEl = document.getElementById("damage");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const fireButton = document.getElementById("fire");
const reloadButton = document.getElementById("reload");

function resize(){
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;

  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";

  ctx.setTransform(
    devicePixelRatio,0,0,
    devicePixelRatio,0,0
  );
}

addEventListener("resize",resize);
resize();

let health = 100;
let armor = 50;
let ammo = 12;
let reserve = 96;
let wave = 1;
let score = 0;

let moveX = 0;
let moveY = 0;

let cameraX = 0;
let cameraY = 0;

let enemies = [];
let bullets = [];
let particles = [];

function spawnWave(){

  enemies = [];

  let amount = 3 + wave * 2;

  for(let i=0;i<amount;i++){

    enemies.push({
      x: Math.random()*innerWidth,
      y: -100-Math.random()*500,
      size: 35+Math.random()*20,
      hp:100,
      speed:0.35+wave*0.04
    });

  }

  messageEl.textContent="WAVE "+wave;

  setTimeout(()=>{
    messageEl.textContent="";
  },1200);
}

spawnWave();

function shoot(){

  if(ammo<=0){
    messageEl.textContent="RELOAD";
    return;
  }

  ammo--;

  bullets.push({
    x:innerWidth/2,
    y:innerHeight/2,
    life:8
  });

  let target=null;
  let best=70;

  enemies.forEach(enemy=>{

    let dx=(enemy.x+cameraX)-innerWidth/2;
    let dy=(enemy.y+cameraY)-innerHeight/2;

    let dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<best){
      best=dist;
      target=enemy;
    }

  });

  if(target){

    target.hp-=50;

    for(let i=0;i<12;i++){

      particles.push({
        x:target.x+cameraX,
        y:target.y+cameraY,
        vx:(Math.random()-.5)*8,
        vy:(Math.random()-.5)*8,
        life:20
      });

    }

    if(target.hp<=0){

      enemies.splice(enemies.indexOf(target),1);
      score+=100;

    }

  }

  updateHUD();
}

function reload(){

  if(ammo>=12 || reserve<=0) return;

  messageEl.textContent="RELOADING...";

  setTimeout(()=>{

    let needed=12-ammo;
    let amount=Math.min(needed,reserve);

    ammo+=amount;
    reserve-=amount;

    messageEl.textContent="";
    updateHUD();

  },700);
}

fireButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  shoot();
});

reloadButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  reload();
});

let joyActive=false;

function moveStick(clientX,clientY){

  let rect=joystick.getBoundingClientRect();

  let cx=rect.left+rect.width/2;
  let cy=rect.top+rect.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  let dist=Math.sqrt(dx*dx+dy*dy);
  let max=40;

  if(dist>max){
    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  moveX=dx/max;
  moveY=dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{

  joyActive=true;
  joystick.setPointerCapture(e.pointerId);
  moveStick(e.clientX,e.clientY);

});

joystick.addEventListener("pointermove",e=>{

  if(joyActive)
    moveStick(e.clientX,e.clientY);

});

joystick.addEventListener("pointerup",()=>{

  joyActive=false;

  moveX=0;
  moveY=0;

  stick.style.transform="translate(0,0)";
});

const keys={};

addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="r")
    reload();

  if(e.code==="Space")
    shoot();
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function damagePlayer(amount){

  if(armor>0){

    let absorbed=Math.min(armor,amount);

    armor-=absorbed;
    amount-=absorbed;

  }

  health-=amount;

  damageEl.style.boxShadow=
    "inset 0 0 120px rgba(255,0,0,.8)";

  setTimeout(()=>{
    damageEl.style.boxShadow=
      "inset 0 0 100px transparent";
  },100);

  if(health<=0){

    health=100;
    armor=50;
    wave=1;
    score=0;
    ammo=12;
    reserve=96;

    cameraX=0;
    cameraY=0;

    messageEl.textContent="MISSION FAILED";

    setTimeout(()=>{
      messageEl.textContent="";
      spawnWave();
    },1200);
  }

  updateHUD();
}

function updateHUD(){

  healthEl.textContent=Math.max(0,Math.floor(health));
  armorEl.textContent=Math.floor(armor);
  waveEl.textContent=wave;
  scoreEl.textContent=score;
  ammoEl.textContent=ammo+" / "+reserve;
}

function drawBackground(){

  let w=innerWidth;
  let h=innerHeight;

  let gradient=
    ctx.createLinearGradient(0,0,0,h);

  gradient.addColorStop(0,"#171717");
  gradient.addColorStop(1,"#030303");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle="#ffffff0c";
  ctx.lineWidth=1;

  for(let x=-1000;x<2000;x+=100){

    ctx.beginPath();

    ctx.moveTo(
      x+(cameraX%100),
      0
    );

    ctx.lineTo(
      x+(cameraX%100),
      h
    );

    ctx.stroke();
  }

  for(let y=-1000;y<2000;y+=100){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y+(cameraY%100)
    );

    ctx.lineTo(
      w,
      y+(cameraY%100)
    );

    ctx.stroke();
  }
}

function drawEnemy(enemy){

  let x=enemy.x+cameraX;
  let y=enemy.y+cameraY;

  ctx.save();

  ctx.translate(x,y);

  ctx.fillStyle="#111";

  ctx.fillRect(
    -enemy.size/2,
    -enemy.size/2,
    enemy.size,
    enemy.size*1.3
  );

  ctx.fillStyle="#fff";

  ctx.fillRect(
    -enemy.size*.22,
    -enemy.size*.12,
    enemy.size*.44,
    enemy.size*.12
  );

  ctx.fillStyle="#333";

  ctx.fillRect(
    -enemy.size*.6,
    enemy.size*.05,
    enemy.size*1.2,
    enemy.size*.15
  );

  ctx.fillStyle="#333";

  ctx.fillRect(
    -enemy.size/2,
    -enemy.size*.75,
    enemy.size,
    5
  );

  ctx.fillStyle="#fff";

  ctx.fillRect(
    -enemy.size/2,
    -enemy.size*.75,
    enemy.size*(enemy.hp/100),
    5
  );

  ctx.restore();
}

function drawGun(){

  let w=innerWidth;
  let h=innerHeight;

  ctx.save();

  ctx.translate(
    w/2+90,
    h-30
  );

  ctx.rotate(-.08);

  ctx.fillStyle="#181818";

  ctx.fillRect(
    -55,-130,
    110,150
  );

  ctx.fillStyle="#333";

  ctx.fillRect(
    -25,-180,
    50,80
  );

  ctx.fillStyle="#555";

  ctx.fillRect(
    -8,-220,
    16,50
  );

  ctx.restore();
}

function update(){

  let speed=4;

  let dx=moveX;
  let dy=moveY;

  if(keys["a"]) dx=-1;
  if(keys["d"]) dx=1;
  if(keys["w"]) dy=-1;
  if(keys["s"]) dy=1;

  cameraX-=dx*speed;
  cameraY-=dy*speed;

  enemies.forEach(enemy=>{

    let screenX=enemy.x+cameraX;
    let screenY=enemy.y+cameraY;

    let dx=
      innerWidth/2-screenX;

    let dy=
      innerHeight/2-screenY;

    let distance=
      Math.sqrt(dx*dx+dy*dy);

    if(distance>1){

      enemy.x+=
        dx/distance*enemy.speed;

      enemy.y+=
        dy/distance*enemy.speed;

    }

    if(distance<70){

      if(Math.random()<.015)
        damagePlayer(5);
    }
  });

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=.92;
    p.vy*=.92;

    p.life--;

  });

  particles=
    particles.filter(p=>p.life>0);

  bullets.forEach(b=>b.life--);

  bullets=
    bullets.filter(b=>b.life>0);

  if(enemies.length===0){

    wave++;

    if(wave===5){

      messageEl.textContent=
        "SECTOR B UNLOCKED";

      setTimeout(()=>{
        messageEl.textContent="";
        spawnWave();
      },1800);

    }else{

      spawnWave();

    }
  }
}

function render(){

  drawBackground();

  enemies.forEach(drawEnemy);

  particles.forEach(p=>{

    ctx.globalAlpha=
      p.life/20;

    ctx.fillStyle="#fff";

    ctx.fillRect(
      p.x,p.y,
      4,4
    );

  });

  ctx.globalAlpha=1;

  drawGun();
}

function loop(){

  update();
  render();

  requestAnimationFrame(loop);
}

updateHUD();
loop();

messageEl.textContent="SECTOR A";

setTimeout(()=>{
  messageEl.textContent="";
},1200);

</script>

</body>
</html>
